<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
<title>Ultrasound Probe Plate</title>
<meta name="description" content="A live technical plate of a curved-array ultrasound probe: the acoustic stack cut open, one pulse, and a B-mode image computed from echoes, built procedurally in three.js.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/plate.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<!-- printed layer, behind the WebGL canvas -->
<div class="plate paper" aria-hidden="true">
  <div class="glow"></div>
  <svg class="glyph-fan" viewBox="0 0 640 520"><path d="M320 40 L60 470 A520 520 0 0 0 580 470 Z"/><path d="M320 40 L320 500"/></svg>
</div>

<canvas id="gl"></canvas>

<!-- everything printed on top of the canvas -->
<div class="plate ui-plate">
  <div class="ui">
    <header class="head frame">
      <span class="head-left" data-i18n="head.left"></span>
      <span class="head-tags" data-i18n-list="head.tags"></span>
      <span class="head-sheet" data-i18n="head.sheet"></span>
      <button class="head-lang" data-act="lang" data-i18n-title="ctl.lang"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><ellipse cx="10" cy="10" rx="3" ry="7"/><path d="M3 10h14M4.2 6.3h11.6M4.2 13.7h11.6"/></svg></button>
    </header>

    <section class="col-left frame">
      <div class="col-text sub">
      <div class="kicker mono" data-i18n="kicker"></div>
      <h1 class="title" data-i18n="title"></h1>
      <div class="subtitle" data-i18n="subtitle"></div>
      <p class="intro" data-i18n="intro"></p>
      </div>

      <div class="col-ctl sub">
      <div class="ctl-top">
        <div class="knob-row">
          <span class="knob-label" data-i18n="ctl.freeze"></span>
          <div class="knob" role="button" tabindex="0" data-act="freeze"><svg viewBox="0 0 100 100" class="knob-arc"><path d="M14 64 A38 38 0 1 1 86 64" /></svg><div class="knob-cap"><i></i></div></div>
          <span class="knob-label scan-lamp" data-i18n="ctl.scan"></span>
        </div>
        <div class="sliders">
          <div class="slider" data-key="f"><span class="sl-name" data-i18n="ctl.f"></span><div class="sl-track"><div class="sl-fill"></div><div class="sl-thumb"></div><div class="sl-ticks"></div></div><span class="sl-val mono"></span></div>
          <div class="slider" data-key="depth"><span class="sl-name" data-i18n="ctl.depth"></span><div class="sl-track"><div class="sl-fill"></div><div class="sl-thumb"></div><div class="sl-ticks"></div></div><span class="sl-val mono"></span></div>
          <div class="slider" data-key="gain"><span class="sl-name" data-i18n="ctl.gain"></span><div class="sl-track"><div class="sl-fill"></div><div class="sl-thumb"></div><div class="sl-ticks"></div></div><span class="sl-val mono"></span></div>
        </div>
      </div>
      <div class="tgc-row"><span class="tgc-name" data-i18n="ctl.tgc"></span><div class="tgc-sl" id="tgc-sl"></div></div>

      <div class="views">
        <button data-view="housing" data-i18n="view.housing"></button>
        <button data-view="cutaway" data-i18n="view.cutaway" class="on"></button>
        <button data-view="beam" data-i18n="view.beam"></button>
        <button data-view="array" data-i18n="view.array"></button>
        <button data-view="section" data-i18n="view.section"></button>
      </div>
      <div class="toggles">
        <button data-act="slow" data-i18n="ctl.slow"></button>
        <button data-act="sound" data-i18n="ctl.sound"></button>
        <button data-act="reset" data-i18n="ctl.reset"></button>
        <button data-act="theme" data-i18n-title="ctl.theme"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5"/><path d="M10 3.5a6.5 6.5 0 0 1 0 13z"/></svg></button>
      </div>
      </div>
    </section>

    <section class="panel spec frame">
      <div class="p-head"><b data-i18n="spec.title"></b><span data-i18n="spec.sub"></span></div>
      <canvas class="inst" data-inst="spec"></canvas>
    </section>
    <section class="panel pen frame">
      <div class="p-head"><b data-i18n="pen.title"></b><span data-i18n="pen.sub"></span></div>
      <canvas class="inst" data-inst="pen"></canvas>
    </section>

    <section class="stage frame" id="stage">
      <svg class="leaders" id="leaders"></svg>
      <ol class="legend mono" id="legend"></ol>
      <div class="callouts" id="callouts"></div>
      <div class="bfilm" id="bfilm">
        <canvas id="bimg"></canvas>
        <span class="f-title mono" data-i18n="b.title"></span>
        <span class="f-fov mono">67.5°</span>
        <div class="f-ruler mono" id="ruler"></div>
        <svg class="f-marks" id="bmarks"></svg>
      </div>
      <svg class="link" id="link"></svg>
      <div class="narr" id="narr"></div>
    </section>

    <section class="panel aline frame">
      <div class="p-head"><b data-i18n="inst.aline"></b><span data-i18n="inst.aline.sub"></span></div>
      <canvas class="inst" data-inst="aline"></canvas>
    </section>
    <section class="panel pulse frame">
      <div class="p-head"><b data-i18n="inst.pulse"></b><span class="mono" id="pulse-sub"></span></div>
      <canvas class="inst" data-inst="pulse"></canvas>
    </section>
    <section class="panel tgc frame">
      <div class="p-head"><b data-i18n="inst.tgc"></b><span data-i18n="inst.tgc.sub"></span></div>
      <canvas class="inst" data-inst="tgc"></canvas>
    </section>
    <section class="panel delay frame">
      <div class="p-head"><b data-i18n="inst.delay"></b><span data-i18n="inst.delay.sub"></span></div>
      <canvas class="inst" data-inst="delay"></canvas>
    </section>

    <section class="dwg d-front frame"><div class="p-head"><b data-i18n="dwg.front"></b></div><div class="dwg-view" data-view="front"></div></section>
    <section class="dwg d-side frame"><div class="p-head"><b data-i18n="dwg.side"></b></div><div class="dwg-view" data-view="side"></div></section>
    <section class="dwg d-array frame"><div class="p-head"><b data-i18n="dwg.array"></b></div><div class="dwg-view" data-view="array"></div></section>
    <section class="dwg d-section frame"><div class="p-head"><b data-i18n="dwg.section"></b></div><div class="dwg-view" data-view="section"></div></section>

    <section class="card frame">
      <div class="p-head"><b data-i18n="card.title"></b><span id="card-sub" data-i18n="card.sub"></span></div>
      <dl id="card"></dl>
    </section>

    <footer class="foot">
      <span data-i18n="foot.left"></span>
      <span class="foot-note" data-i18n="foot.note"></span>
      <span class="foot-right"><span class="colorbar"><i></i><i></i><i></i><i></i><i></i><i class="r"></i><i class="r2"></i></span><span data-i18n="foot.right"></span>
        <svg class="reg" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6"/><path d="M10 0V20M0 10H20"/></svg></span>
    </footer>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
